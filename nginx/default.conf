server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    # ── Gzip — dentro del server block para compatibilidad con nginx perimetral
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml
        application/rss+xml application/atom+xml
        image/svg+xml font/woff2;

    # ── Headers de seguridad
    # X-Forwarded-Proto ya viene del nginx perimetral (Certbot/HTTPS)
    # Solo agregamos los que no duplica el perimetral
    add_header X-Frame-Options        "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header X-XSS-Protection       "1; mode=block" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy     "geolocation=(self)" always;

    # ── Imágenes subidas — servidas directamente por nginx ───────────────────
    location /uploads/ {
        alias /uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    # ── API backend ──────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://retopa-backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # ── SEO: URLs jerárquicas + sitemaps + robots — frontend SSR ─────────────
    location ~ ^/(negocios?(/.*)?|negocio(/.*)?|sitemap[^/]*\.xml|robots\.txt)$ {
        proxy_pass http://retopa-frontend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=300";
    }

    # ── Todo lo demás → frontend ─────────────────────────────────────────────
    location / {
        proxy_pass http://retopa-frontend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
