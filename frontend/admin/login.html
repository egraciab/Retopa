<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RetoPA — Acceso Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 50%, #0f172a 100%); min-height: 100vh; }
        .glass { background: rgba(255,255,255,0.05); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">
    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-[#0ea5e9] rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-blue-500/30">
                <i class="fas fa-compass text-white text-2xl"></i>
            </div>
            <h1 class="text-2xl font-black text-white">RetoPA</h1>
            <p class="text-blue-300 text-sm mt-1">Panel de Administración</p>
        </div>
        <div class="glass rounded-3xl p-8">
            <h2 class="text-xl font-bold text-white mb-6 text-center">Iniciar sesión</h2>
            <div id="mfaStep" class="hidden">
                <p class="text-blue-200 text-sm text-center mb-6"><i class="fas fa-envelope mr-1"></i> Ingresá el código de 6 dígitos enviado a tu email.</p>
                <input type="text" id="mfaCode" maxlength="6" inputmode="numeric"
                    class="w-full bg-white/10 border border-white/20 text-white rounded-xl px-4 py-3 text-center text-2xl font-mono tracking-widest focus:outline-none focus:ring-2 focus:ring-blue-400 mb-4"
                    placeholder="000000">
                <button onclick="submitMfa()" class="w-full bg-[#0ea5e9] hover:bg-[#0284c7] text-white font-bold py-3 rounded-xl transition flex items-center justify-center gap-2">
                    <i class="fas fa-shield-alt"></i> Verificar código
                </button>
                <button onclick="showLoginStep()" class="w-full text-blue-300 text-sm mt-3 hover:text-white transition">← Volver</button>
            </div>
            <div id="loginStep">
                <div class="space-y-4">
                    <div>
                        <label class="block text-blue-200 text-sm font-medium mb-2">Email</label>
                        <div class="relative">
                            <i class="fas fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-blue-400 text-sm"></i>
                            <input type="email" id="adminEmail" class="w-full bg-white/10 border border-white/20 text-white rounded-xl pl-10 pr-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-400 placeholder-white/30" placeholder="admin@empresa.com">
                        </div>
                    </div>
                    <div>
                        <label class="block text-blue-200 text-sm font-medium mb-2">Contraseña</label>
                        <div class="relative">
                            <i class="fas fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-blue-400 text-sm"></i>
                            <input type="password" id="adminPassword" onkeydown="if(event.key==='Enter') submitLogin()"
                                class="w-full bg-white/10 border border-white/20 text-white rounded-xl pl-10 pr-12 py-3 focus:outline-none focus:ring-2 focus:ring-blue-400 placeholder-white/30" placeholder="••••••••">
                            <button onclick="togglePass()" class="absolute right-4 top-1/2 -translate-y-1/2 text-blue-400 hover:text-white transition"><i class="fas fa-eye" id="passIcon"></i></button>
                        </div>
                    </div>
                    <div id="loginError" class="hidden bg-red-500/20 border border-red-500/40 text-red-300 rounded-xl px-4 py-3 text-sm flex items-center gap-2">
                        <i class="fas fa-exclamation-circle"></i><span id="loginErrorMsg"></span>
                    </div>
                    <button onclick="submitLogin()" id="loginBtn" class="w-full bg-[#0ea5e9] hover:bg-[#0284c7] text-white font-bold py-3 rounded-xl transition flex items-center justify-center gap-2 mt-2">
                        <i class="fas fa-sign-in-alt"></i> Ingresar al panel
                    </button>
                </div>
            </div>
        </div>
        <p class="text-center text-blue-400/50 text-xs mt-6">Solo para personal autorizado de RetoPA</p>
    </div>
    <script>
        const API_BASE = '/api/v2';
        let pendingUserId = null;
        // Verificar sesión existente
        (function() {
            const t = localStorage.getItem('adminToken');
            if (t) { try { const p = JSON.parse(atob(t.split('.')[1])); if (p.exp*1000 > Date.now() && ['admin','godmode'].includes(p.role)) window.location.href = '/admin/index.html'; } catch(e) { localStorage.removeItem('adminToken'); } }
        })();
        function togglePass() { const i=document.getElementById('adminPassword'),ic=document.getElementById('passIcon'); i.type=i.type==='password'?'text':'password'; ic.className=i.type==='text'?'fas fa-eye-slash':'fas fa-eye'; }
        function showError(m) { document.getElementById('loginError').classList.remove('hidden'); document.getElementById('loginErrorMsg').textContent=m; }
        function showLoginStep() { document.getElementById('loginStep').classList.remove('hidden'); document.getElementById('mfaStep').classList.add('hidden'); }
        async function submitLogin() {
            const email=document.getElementById('adminEmail').value.trim(), pass=document.getElementById('adminPassword').value, btn=document.getElementById('loginBtn');
            document.getElementById('loginError').classList.add('hidden');
            if (!email||!pass) return showError('Completá todos los campos');
            btn.disabled=true; btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> Ingresando...';
            try {
                const res=await fetch(`${API_BASE}/auth/admin-login`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password:pass})});
                const data=await res.json();
                if (data.mfa_required) { pendingUserId=data.user_id; document.getElementById('loginStep').classList.add('hidden'); document.getElementById('mfaStep').classList.remove('hidden'); document.getElementById('mfaCode').focus(); return; }
                if (!data.success) return showError(data.error||'Error al ingresar');
                localStorage.setItem('adminToken',data.token); localStorage.setItem('adminUser',JSON.stringify(data.user)); localStorage.removeItem('adminKey');
                window.location.href='/admin/index.html';
            } catch(e) { showError('Error de conexión'); }
            finally { btn.disabled=false; btn.innerHTML='<i class="fas fa-sign-in-alt"></i> Ingresar al panel'; }
        }
        async function submitMfa() {
            const code=document.getElementById('mfaCode').value.trim();
            if (code.length!==6) return;
            try {
                const res=await fetch(`${API_BASE}/auth/mfa-verify`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:pendingUserId,otp:code})});
                const data=await res.json();
                if (!data.success) { document.getElementById('mfaCode').value=''; return; }
                localStorage.setItem('adminToken',data.token); localStorage.setItem('adminUser',JSON.stringify(data.user)); localStorage.removeItem('adminKey');
                window.location.href='/admin/index.html';
            } catch(e) {}
        }
    </script>
</body>
</html>
