<div class="card shadow-sm">
  <div class="card-header d-flex justify-content-between align-items-center">
    <span>Categorías</span>
    <button id="category-create-btn" class="btn btn-sm btn-primary">Nueva categoría</button>
  </div>
  <div class="card-body border-bottom d-none" id="category-form-wrap">
    <div class="row g-2 align-items-end">
      <input type="hidden" id="category-id" />
      <div class="col-md-4">
        <label for="category-name" class="form-label mb-1">Nombre</label>
        <input id="category-name" class="form-control" />
      </div>
      <div class="col-md-4">
        <label for="category-slug" class="form-label mb-1">Slug</label>
        <input id="category-slug" class="form-control" />
      </div>
      <div class="col-md-4 d-flex gap-2">
        <button id="category-save-btn" class="btn btn-primary">Guardar</button>
        <button id="category-cancel-btn" class="btn btn-secondary">Cancelar</button>
      </div>
    </div>
  </div>
  <div class="table-responsive">
    <table class="table table-striped mb-0">
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Slug</th>
          <th class="text-end">Acciones</th>
        </tr>
      </thead>
      <tbody id="categories-tbody">
        <tr><td colspan="3" class="text-muted">Loading...</td></tr>
      </tbody>
    </table>
  </div>
</div>
