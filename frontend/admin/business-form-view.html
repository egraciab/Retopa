<div class="card shadow-sm">
  <div class="card-header d-flex justify-content-between align-items-center">
    <span id="business-form-title">Nuevo negocio</span>
    <a href="/admin/layout.html#businesses?page=1" class="btn btn-sm btn-secondary">Volver</a>
  </div>
  <div class="card-body">
    <div id="business-form-feedback" class="mb-3"></div>
    <form id="business-form">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label" for="bf-name">Nombre *</label>
          <input id="bf-name" class="form-control" required />
        </div>
        <div class="col-md-6">
          <label class="form-label" for="bf-address">Dirección</label>
          <input id="bf-address" class="form-control" />
        </div>
        <div class="col-md-4">
          <label class="form-label" for="bf-phone">Teléfono</label>
          <input id="bf-phone" class="form-control" />
        </div>
        <div class="col-md-4">
          <label class="form-label" for="bf-email">Email</label>
          <input id="bf-email" class="form-control" />
        </div>
        <div class="col-md-4">
          <label class="form-label" for="bf-website">Website</label>
          <input id="bf-website" class="form-control" />
        </div>
        <div class="col-md-4">
          <label class="form-label" for="bf-city-id">Ciudad</label>
          <select id="bf-city-id" class="form-select"></select>
        </div>
        <div class="col-md-4">
          <label class="form-label" for="bf-category-id">Categoría</label>
          <select id="bf-category-id" class="form-select"></select>
        </div>
        <div class="col-md-4">
          <label class="form-label" for="bf-source">Source</label>
          <input id="bf-source" class="form-control" value="manual" />
        </div>
        <div class="col-md-3">
          <label class="form-label" for="bf-latitude">Latitud</label>
          <input id="bf-latitude" class="form-control" />
        </div>
        <div class="col-md-3">
          <label class="form-label" for="bf-longitude">Longitud</label>
          <input id="bf-longitude" class="form-control" />
        </div>
        <div class="col-md-3 d-flex align-items-end">
          <div class="form-check">
            <input id="bf-claimed" class="form-check-input" type="checkbox" />
            <label class="form-check-label" for="bf-claimed">Claimed</label>
          </div>
        </div>
      </div>
      <div class="mt-3 d-flex gap-2">
        <button id="business-form-submit" class="btn btn-primary" type="submit">Guardar</button>
        <button id="business-form-delete" class="btn btn-danger d-none" type="button">Eliminar negocio</button>
      </div>
    </form>
  </div>
</div>
